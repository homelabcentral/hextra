name: Build Tests

on:
  push:
  pull_request:
    branches: [main]

# The event is part of the group on purpose: push and pull_request both fire
# for a same-repo push with an open PR, and without it they share a group and
# cancel each other - leaving the push run cancelled and the pull_request run
# skipped by the guard below, so nothing runs at all.
concurrency:
  group: build-tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-tests:
    runs-on: ubuntu-latest
    # Push covers every branch in this repository; pull_request is kept only for
    # PRs opened from a fork, whose pushes land in the fork and never fire here.
    # Without this guard both events fire for a same-repo push with an open PR,
    # running the suite twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    env:
      HUGO_VERSION: 0.166.0
      # These specs build temporary Hugo sites and inspect the output files
      # directly, so no browser or web server is needed. Setting BASE_URL
      # keeps Playwright from starting the docs webServer.
      BASE_URL: http://localhost:1313
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # No dependencies needed: the generator is plain Node. Runs before the
      # slower steps so a stale skill reference fails the job early.
      - name: Check generated skill references are current
        run: node scripts/build-skill.mjs --check

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install dependencies
        run: npm ci

      - name: Run build tests
        run: npm run test:build

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-tests-report
          path: playwright-report/
          retention-days: 14
