name: Accessibility Tests

on:
  push:
  pull_request:
    branches: [main]

# The event is part of the group on purpose: push and pull_request both fire
# for a same-repo push with an open PR, and without it they share a group and
# cancel each other - leaving the push run cancelled and the pull_request run
# skipped by the guard below, so nothing runs at all.
concurrency:
  group: accessibility-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  a11y:
    runs-on: ubuntu-latest
    # Push covers every branch in this repository; pull_request is kept only for
    # PRs opened from a fork, whose pushes land in the fork and never fire here.
    # Without this guard both events fire for a same-repo push with an open PR,
    # running the suite twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    environment: accessibility
    env:
      HUGO_VERSION: 0.161.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build site
        run: npm run build

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 14
