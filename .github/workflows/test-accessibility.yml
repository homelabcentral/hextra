name: Accessibility Tests

on:
  push:
  pull_request:
    branches: [main]

# The event is part of the group on purpose: push and pull_request both fire
# for a same-repo push with an open PR, and they build different commits - the
# branch head and refs/pull/N/merge. Sharing a group would make them cancel each
# other, so one of the two commits would go untested.
concurrency:
  group: accessibility-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  a11y:
    runs-on: ubuntu-latest
    # Both events run, and they are not redundant: a push builds the branch head,
    # while a pull_request builds refs/pull/N/merge - the branch merged into the
    # current main. Only the second catches a change that is green on its own
    # branch and breaks once main has moved. A guard that skipped pull_request
    # for same-repo PRs left nothing testing the merge commit, and because a job
    # skipped by a job-level `if` reports as satisfied, the required check went
    # green without running.
    environment: accessibility
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build site
        run: npm run build

      - name: Run accessibility tests
        run: npm run test:a11y

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 14
