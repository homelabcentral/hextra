name: Generated Assets

# Two tracked files are build output: docs/hugo_stats.json, which Hugo writes
# from the rendered site, and assets/css/compiled/main.css, which Tailwind
# tree-shakes from those stats. Nothing verified they matched their inputs.
#
# The failure this catches is silent in every other check. Deleting content
# leaves classes in the stats that no page uses any more; adding a utility class
# without regenerating leaves it out of the CSS entirely, so the style is simply
# missing from the built site while every test still passes.
#
# `make css` regenerates both, in the order the Makefile enforces (stats, then
# compile). If the result differs from what was committed, the tree was built
# from stale inputs.
#
# Its own workflow rather than a step in another: the other test workflows use
# `npm run build`, which renders the site but does NOT recompile the CSS, so
# there is nothing to compare there.

on:
  push:
  pull_request:
    branches: [main]

# The event is part of the group on purpose: push and pull_request both fire
# for a same-repo push with an open PR, and they build different commits - the
# branch head and refs/pull/N/merge. Sharing a group would make them cancel each
# other, so one of the two commits would go untested.
concurrency:
  group: assets-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  assets:
    runs-on: ubuntu-latest
    # Both events run, and they are not redundant: a push builds the branch head,
    # while a pull_request builds refs/pull/N/merge - the branch merged into the
    # current main. Only the second catches a change that is green on its own
    # branch and breaks once main has moved. A guard that skipped pull_request
    # for same-repo PRs left nothing testing the merge commit, and because a job
    # skipped by a job-level `if` reports as satisfied, the required check went
    # green without running.
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      # `touch` matters: the Makefile's `deps` is a file rule on node_modules and
      # would re-run `npm install` if the directory looked older than
      # package-lock.json - an install that can rewrite the lockfile, which the
      # diff below would then report as drift.
      - name: Install dependencies
        run: |
          npm ci
          touch node_modules

      - name: Regenerate stats and CSS
        run: make css

      - name: Check the committed output matches
        run: |
          if ! git diff --exit-code -- docs/hugo_stats.json assets/css/compiled/main.css; then
            echo "::error::Generated assets are stale. Run 'make css' and commit the result."
            exit 1
          fi
