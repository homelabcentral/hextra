name: Format Check

# Nothing in CI checked formatting until now. AGENTS.md tells contributors to
# run `make verify` before committing, and the other workflows were written
# assuming that happened - which holds right up until it doesn't, and a
# misformatted file merges with three green checks.
#
# Kept as its own workflow rather than a step inside another so a failure names
# itself: "Format Check" failing means run `make fmt`, nothing else.

on:
  push:
  pull_request:
    branches: [main]

# The event is part of the group on purpose: push and pull_request both fire
# for a same-repo push with an open PR, and they build different commits - the
# branch head and refs/pull/N/merge. Sharing a group would make them cancel each
# other, so one of the two commits would go untested.
concurrency:
  group: format-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ubuntu-latest
    # Both events run, and they are not redundant: a push builds the branch head,
    # while a pull_request builds refs/pull/N/merge - the branch merged into the
    # current main. Only the second catches a change that is green on its own
    # branch and breaks once main has moved. A guard that skipped pull_request
    # for same-repo PRs left nothing testing the merge commit, and because a job
    # skipped by a job-level `if` reports as satisfied, the required check went
    # green without running.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # Needs the real install, not just prettier: .prettierrc loads
      # prettier-plugin-go-template, and without it prettier fails outright on
      # the Go templates rather than checking them.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check . --log-level warn
