# Dev environment for the Hextra theme.
#
#   dev      the workspace container the editor attaches to
#   preview  a ~258 kB static file server that serves the production build
#
# `preview` starts with the dev container and stays up. It serves whatever is
# in docs/public, so re-running `make build` updates the served site with no
# container restart.

# Compose project name. Without it the project is named after this file's
# directory, giving containers like `devcontainer-dev-1`.
name: hextra

services:
  dev:
    image: mcr.microsoft.com/devcontainers/go:1
    # Run the container itself as vscode, not root. The image ships with
    # USER root so features can install packages at build time, and its
    # metadata sets `remoteUser: vscode` - but that only covers VS Code Server,
    # terminals and postCreateCommand, leaving the container process as root.
    # `containerUser` is ignored for compose-based dev containers, so the user
    # has to be set here. Build-time steps are unaffected; this is runtime only.
    #
    # The docker socket still works: docker-init.sh from the
    # docker-outside-of-docker feature wraps its privileged calls in a sudoIf
    # helper and, when the socket's gid cannot be joined (it is 0 on Docker
    # Desktop for macOS), replaces the socket with a socat proxy owned by
    # vscode. If that ever stops working, `group_add: ["0"]` is the fallback.
    user: vscode
    environment:
      # GitHub API token for `gh`, taken from HEXTRA_GH_TOKEN on the host and
      # renamed on the way in. The rename is the point: `gh` prefers GH_TOKEN
      # over its own stored credentials, so exporting GH_TOKEN on the host would
      # silently re-authenticate every host terminal as this account. Under a
      # different name the host keyring is untouched and only the container sees
      # GH_TOKEN.
      #
      # Populate it from the macOS Keychain in ~/.zshrc:
      #
      #   export HEXTRA_GH_TOKEN="$(security find-generic-password \
      #     -a homelabcentral -s gh-token-hextra -w 2>/dev/null)"
      #
      # VS Code resolves .zshrc in a spawned shell at startup, so this reaches
      # the container however VS Code was launched - Dock and Spotlight included,
      # not just `code .` from a terminal. Nothing is written to disk: no .env,
      # and unlike containerEnv no plaintext copy lands in the generated compose
      # override under globalStorage.
      #
      # The `:-` default keeps compose quiet when the variable is unset; `gh` is
      # simply unauthenticated then.
      - GH_TOKEN=${HEXTRA_GH_TOKEN:-}
      # Container images default to UTC, which puts every timestamp the
      # container writes - `hugo new` dates, git author times, build logs -
      # hours away from the host's. HOST_TZ comes from the same guarded block
      # in ~/.zshrc as the token above, derived there from the host's
      # /etc/localtime. The image already carries /usr/share/zoneinfo, so a
      # zone name resolves without installing tzdata.
      #
      # TZ is read at process start, so changing it needs a container rebuild,
      # not a Reload Window.
      - TZ=${HOST_TZ:-Etc/UTC}
    volumes:
      - ..:/workspaces/hextra:cached
      # Named volume masks node_modules so the container keeps its own
      # Linux-native binaries (lightningcss etc.) instead of sharing the
      # host's Darwin ones through the bind mount.
      - node_modules:/workspaces/hextra/node_modules
      # Host Docker socket so act (`make ci*`) can start job containers.
      # Those run as SIBLINGS of this container on the host daemon, not
      # inside it - paths act mounts must exist on the host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Host SSH config and keys, read-only, so git inside the container picks
      # the same per-host identity the host does - `git@github-homelabcentral:`
      # uses the homelabcentral key, everything else the default.
      #
      # The keys are never unlocked here: VS Code forwards the host ssh-agent
      # automatically and the agent does the signing. This mount exists only so
      # ssh can read ~/.ssh/config and the IdentityFile paths it names, which is
      # the only way to pick one identity out of a multi-key agent.
      #
      # Requires `IgnoreUnknown UseKeychain` in a leading `Host *` block on the
      # host: UseKeychain is macOS-only and Linux OpenSSH aborts the whole file
      # on it ("Bad configuration option: usekeychain").
      - type: bind
        source: ${HOME}/.ssh
        target: /home/vscode/.ssh
        read_only: true
    # Keep the container alive; the dev container attaches to it.
    command: sleep infinity

  preview:
    image: pierrezemb/gostatic
    restart: unless-stopped
    volumes:
      # goStatic serves /srv/http by default. Read-only: this container should
      # never write to the build output.
      - ../docs/public:/srv/http:ro
    command:
      - "-enable-logging"
      # Without this the browser caches aggressively and you end up debugging
      # a stale page instead of the one you just built.
      - "-append-header"
      - "Cache-Control:no-store"

volumes:
  # Per-container node_modules; the host keeps its own copy on disk.
  node_modules:
